name: Security veracode policy scan
on:
  workflow_dispatch:
  schedule:
    - cron: "32 5 * * 1" # Every Monday at 05:32 UTC
jobs:
  security-veracode-policy-check:
    permissions:
      contents: read
      actions: read
      security-events: write
    name: Project security veracode policy scan
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/security_veracode_policy_scan.yml@aa7934bf3929b486249fa07ed8c88d6d36270a4c # v2.19.1
    with:
      channel_id: ${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID || 'NO_SLACK' }}
    secrets: inherit
